<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            sans: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            canvas: '#131518',
            surface: '#191c20',
            surfaceElevated: '#21252b',
            borderSubtle: '#2c313a',
            crimson: '#a8383b',
            crimsonHover: '#8f2e31',
          },
        },
      },

  <style>
    :root {
      color-scheme: dark;
      --accent-soft: #d6a0a0;
      --accent-bright: #e2b5b2;
      --line-soft: rgba(170, 180, 194, 0.10);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c313a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a414d; }

    body {
      background-image: radial-gradient(ellipse at 50% -18%, rgba(168, 56, 59, 0.10), transparent 48%);
    }

    header {
      min-height: 58px;
      border-color: var(--line-soft) !important;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
    }

    header h1 {
      letter-spacing: -0.075em;
      font-size: 17px;
    }

    .author-link {
      color: var(--accent-soft);
      text-decoration: none;
      font-weight: 600;
      transition: color 160ms ease, text-shadow 160ms ease;
    }
    .author-link:hover {
      color: #f0c7c3;
      text-shadow: 0 0 16px rgba(214, 160, 160, 0.22);
    }

    .presence-icon {
      filter: drop-shadow(0 0 6px rgba(244, 114, 182, 0.25));
    }

    /* Color-Changing Connecting Loader */
    @keyframes dotPulseColor {
      0%, 100% {
        opacity: 0.28;
        transform: translateY(0) scale(0.92);
        color: #77808d;
      }
      50% {
        opacity: 1;
        transform: translateY(-2px) scale(1.12);
        color: var(--accent-bright);
        text-shadow: 0 0 10px rgba(226, 181, 178, 0.45);
      }
    }

    .loader-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .loader-group span {
      display: inline-block;
      animation: dotPulseColor 1.2s ease-in-out infinite;
    }
    .loader-group span:nth-child(2) { animation-delay: 0.16s; }
    .loader-group span:nth-child(3) { animation-delay: 0.32s; }

    /* Toasts */
    .toast-container { width: min(calc(100vw - 24px), 320px); }
    .app-toast {
      display: block;
      width: fit-content;
      max-width: 100%;
      padding: 8px 11px;
      border: 1px solid rgba(170, 180, 194, 0.10);
      border-radius: 9px;
      background: rgba(25, 28, 32, 0.72);
      color: rgba(225, 228, 234, 0.94);
      font: 500 10px/1.45 "JetBrains Mono", ui-monospace, monospace;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .app-toast.is-visible { opacity: 1; transform: translateY(0); }
    .app-toast.is-error { color: #e2bfc1; border-color: rgba(185, 107, 112, 0.25); }

    /* Message Feed */
    #messages-container {
      width: 100%;
      max-width: 960px;
      margin-inline: auto;
      padding-inline: clamp(16px, 4vw, 36px);
      scrollbar-gutter: stable;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-enter { animation: bubbleIn 140ms ease-out both; }

    .message-row {
      touch-action: pan-y;
      scroll-margin-block: 42vh;
    }

    .message-bubble {
      will-change: transform;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.09);
      line-height: 1.55;
      transition: transform 130ms ease, background-color 150ms ease, border-color 150ms ease;
    }
    .message-row.swiping .message-bubble { transition: none; }
    .message-row.is-expanded .message-bubble {
      border-color: rgba(214, 160, 160, 0.20);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
    }

    .message-details { display: none; }
    .message-row.is-expanded .message-details { display: block; }
    .message-basic-meta { display: flex; }
    .message-row.is-expanded .message-basic-meta { display: none; }

    .message-swipe-hint {
      position: absolute;
      left: -34px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      color: rgba(251, 207, 232, 0.8);
      transition: opacity 120ms ease;
      pointer-events: none;
    }
    .message-row.swiping .message-swipe-hint { opacity: 1; }

    .message-details .meta-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 0;
    }
    .message-details .meta-line + .meta-line { margin-top: 2px; }
    .message-details .meta-key { color: #77808d; }
    .message-details .meta-value {
      color: #aeb5bf;
      text-align: right;
      overflow-wrap: anywhere;
      user-select: text;
    }

    /* Reply Quote & Jump Highlight */
    .reply-quote {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 7px;
      padding: 6px 9px;
      border-left: 2px solid rgba(226, 181, 178, 0.48);
      border-radius: 0 8px 8px 0;
      background: rgba(0, 0, 0, 0.16);
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .reply-quote:hover {
      background: rgba(214, 160, 160, 0.10);
      border-left-color: rgba(226, 181, 178, 0.95);
      transform: translateX(2px);
    }
    .reply-quote:active {
      background: rgba(214, 160, 160, 0.16);
      transform: translateX(1px) scale(0.995);
    }

    .message-jump-highlight .message-bubble {
      position: relative;
      z-index: 2;
      animation: messagePulse 2.8s ease-out both;
    }
    .message-jump-highlight::before {
      content: "ORIGINAL MESSAGE";
      align-self: flex-start;
      margin: 0 0 6px 7px;
      padding: 3px 7px;
      border: 1px solid rgba(226, 181, 178, 0.28);
      border-radius: 6px;
      background: rgba(45, 31, 34, 0.92);
      color: #e2b5b2;
      font: 600 8px/1.3 "JetBrains Mono", monospace;
      letter-spacing: 0.09em;
      animation: labelIn 180ms ease-out both;
    }
    @keyframes labelIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes messagePulse {
      0%, 22% {
        outline: 2px solid rgba(226, 181, 178, 0.95);
        outline-offset: 3px;
        background-color: rgba(214, 160, 160, 0.2);
        box-shadow: 0 0 0 6px rgba(214, 160, 160, 0.10), 0 0 30px rgba(214, 160, 160, 0.22);
        transform: scale(1.012);
      }
      100% {
        outline-color: transparent;
        outline-offset: 8px;
        background-color: transparent;
        box-shadow: 0 0 0 6px transparent, 0 0 30px transparent;
        transform: scale(1);
      }
    }

    /* Footer & Controls */
    footer {
      border-color: var(--line-soft) !important;
      background: rgba(25, 28, 32, 0.94) !important;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(14px);
    }
    #message-form { max-width: 760px; }
    #message-input { caret-color: var(--accent-bright); }
    #attach-btn, #send-btn { transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease; }
    #attach-btn:hover { background-color: rgba(255, 255, 255, 0.045); }
    #send-btn { box-shadow: 0 3px 12px rgba(168, 56, 59, 0.18); }
    #send-btn:hover { box-shadow: 0 4px 16px rgba(168, 56, 59, 0.28); }

    button:focus-visible, a:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(214, 160, 160, 0.72);
      outline-offset: 3px;
    }

    @media (min-width: 900px) {
      #messages-container { padding-top: 28px; padding-bottom: 28px; }
      footer { padding-top: 16px; padding-bottom: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-canvas text-slate-200 font-mono h-dvh flex flex-col overflow-hidden antialiased selection:bg-rose-900/35 selection:text-rose-200">
  
  <!-- Header -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      remove,
      onValue,
      off,
      onDisconnect,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    /* ==========================================================================
       1. CONFIGURATION & CONSTANTS
       ========================================================================== */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAn06v2-5QKASkAObavHcbmofg39Wm8V-c",
      authDomain: "yappify-b9b5e.firebaseapp.com",
      databaseURL: "https://yappify-b9b5e-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "yappify-b9b5e",
      storageBucket: "yappify-b9b5e.firebasestorage.app",
      messagingSenderId: "397289116851",
      appId: "1:397289116851:web:0800b4ae59d77220308cc6",
    };

    const IMGBB_API_KEY = "726fbbd12de1823c568d55f0be750282";
    const ROOM_ID = "public-lobby";
    const COOLDOWN_MS = 2500;
    const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
    const ALLOWED_IMAGE_TYPES = new Set(["image/jpeg", "image/png", "image/webp", "image/gif"]);

    // Presence heartbeat & stale threshold (server-time synced to eliminate clock drift)
    const PRESENCE_PING_MS = 12000;
    const PRESENCE_STALE_MS = 35000;
    const GHOST_PING_TEXT = "\u200b";

    // Unique per-tab session ID so multiple tabs or devices never collide or duplicate
    const TAB_SESSION_ID = (() => {
      try {
        const existing = sessionStorage.getItem("yappify_tab_sid");
        if (existing) return existing;
        const fresh = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
        sessionStorage.setItem("yappify_tab_sid", fresh);
        return fresh;
      } catch {
        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
      }
    })();

    /* ==========================================================================
       2. APPLICATION STATE & DOM REFERENCES
       ========================================================================== */
    let db = null;
    let clientId = TAB_SESSION_ID;
    let serverTimeOffsetMs = 0;
    let lastSentAt = 0;
    let profanityFilter = null;
    let profanityFilterLoadFailed = false;
    let replyTarget = null;
    let selectedImage = null;
    let previewObjectUrl = null;
    let hasInitialRoomRender = false;
    let unsubscribeRoom = null;
    let activeGhostEntries = [];

    const renderedMessageIds = new Set();

    const dom = {
      messagesContainer: document.getElementById("messages-container"),
      jumpLatestBtn: document.getElementById("jump-latest-btn"),
      messageForm: document.getElementById("message-form"),
      messageInput: document.getElementById("message-input"),
      imageInput: document.getElementById("image-input"),
      attachBtn: document.getElementById("attach-btn"),
      sendBtn: document.getElementById("send-btn"),
      imagePreviewWrap: document.getElementById("image-preview-wrap"),
      imagePreview: document.getElementById("image-preview"),
      imageName: document.getElementById("image-name"),
      removeImageBtn: document.getElementById("remove-image-btn"),
      onlineCount: document.getElementById("online-count"),
      statusDot: document.getElementById("status-dot"),
      toastContainer: document.getElementById("toast-container"),
      replyPreview: document.getElementById("reply-preview"),
      replyPreviewText: document.getElementById("reply-preview-text"),
      cancelReplyBtn: document.getElementById("cancel-reply-btn"),
    };

    /* ==========================================================================
       3. UTILITIES (TOASTS, CLIPBOARD, TIME, LINKS)
       ========================================================================== */
    function getServerNow() {
      return Date.now() + serverTimeOffsetMs;
    }

    function setConnectionStatus(state) {
      const base = "absolute left-1/2 -translate-x-1/2 top-[1px] w-[2px] h-[2px] rounded-full transition-colors";
      if (state === "live") {
        dom.statusDot.className = `${base} bg-emerald-300/85`;
        dom.statusDot.title = "Connected";
      } else if (state === "error") {
        dom.statusDot.className = `${base} bg-rose-400/90`;
        dom.statusDot.title = "Server down";
      } else {
        dom.statusDot.className = `${base} bg-amber-300/80`;
        dom.statusDot.title = "Connecting";
      }
    }

    function showToast(message, isError = false) {
      const el = document.createElement("div");
      el.className = `app-toast pointer-events-auto${isError ? " is-error" : ""}`;
      el.textContent = message;
      dom.toastContainer.appendChild(el);
      requestAnimationFrame(() => el.classList.add("is-visible"));
      window.setTimeout(() => {
        el.classList.remove("is-visible");
        window.setTimeout(() => el.remove(), 200);
      }, 2600);
    }

    function copyTextToClipboard(value) {
      const helper = document.createElement("textarea");
      helper.value = value;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.top = "0";
      helper.style.left = "-9999px";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      helper.setSelectionRange(0, helper.value.length);

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (err) {
        console.warn("Clipboard copy failed:", err);
      }
      helper.remove();
      return copied;
    }

    function formatRelativeTime(ts) {
      const timestamp = Number(ts);
      if (!Number.isFinite(timestamp) || timestamp <= 0) return "";

      const diffSec = Math.max(0, Math.floor((getServerNow() - timestamp) / 1000));
      if (diffSec < 1) return "just now";
      if (diffSec < 60) return `${diffSec} sec ago`;

      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin} min ago`;

      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr} ${diffHr === 1 ? "hr" : "hrs"} ago`;

      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay} ${diffDay === 1 ? "day" : "days"} ago`;
    }

    function appendTextWithLinks(container, text, isMine) {
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      let lastIndex = 0;

      for (const match of text.matchAll(urlRegex)) {
        const start = match.index ?? 0;
        if (start > lastIndex) {
          container.appendChild(document.createTextNode(text.slice(lastIndex, start)));
        }

        const url = match[0];
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer nofollow";
        link.textContent = url;
        link.className = isMine
          ? "underline underline-offset-2 decoration-rose-200/70 hover:text-white break-all"
          : "underline underline-offset-2 decoration-rose-400/60 text-rose-300 hover:text-rose-200 break-all";
        link.addEventListener("click", (e) => e.stopPropagation());
        container.appendChild(link);

        lastIndex = start + url.length;
      }

      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
    }

    /* ==========================================================================
       4. PROFANITY FILTER
       ========================================================================== */
    async function loadProfanityFilter() {
      try {
        const mod = await import("https://esm.sh/leo-profanity@1.9.0");
        profanityFilter = mod.default || mod;
      } catch (err) {
        profanityFilterLoadFailed = true;
        console.warn("Profanity filter failed to load:", err);
        showToast("Word filter unavailable. Please reload before sending text.", true);
      }
    }

    /* ==========================================================================
       5. SCROLL & MESSAGE NAVIGATION
       ========================================================================== */
    function isNearBottom() {
      const { scrollHeight, scrollTop, clientHeight } = dom.messagesContainer;
      return scrollHeight - scrollTop - clientHeight <= 96;
    }

    function scrollToBottom(smooth = false) {
      dom.messagesContainer.scrollTo({
        top: dom.messagesContainer.scrollHeight,
        behavior: smooth ? "smooth" : "auto",
      });
      dom.jumpLatestBtn.classList.add("hidden");
    }

    function jumpToMessage(messageId) {
      if (!messageId) {
        showToast("Original message is unavailable", true);
        return;
      }

      const target = document.getElementById(`message-${CSS.escape(String(messageId))}`);
      if (!target) {
        showToast("Original message is no longer in the chat", true);
        return;
      }

      document.querySelectorAll(".message-jump-highlight").forEach((el) => {
        el.classList.remove("message-jump-highlight");
      });

      void target.offsetWidth;
      target.classList.add("message-jump-highlight");
      target.scrollIntoView({ behavior: "smooth", block: "center" });

      const bubble = target.querySelector(".message-bubble");
      if (bubble) bubble.setAttribute("aria-label", "Original message");

      window.clearTimeout(target._jumpTimer);
      target._jumpTimer = window.setTimeout(() => {
        target.classList.remove("message-jump-highlight");
        if (bubble) bubble.removeAttribute("aria-label");
      }, 2800);
    }

    dom.messagesContainer.addEventListener("scroll", () => {
      if (isNearBottom()) dom.jumpLatestBtn.classList.add("hidden");
    });

    dom.jumpLatestBtn.addEventListener("click", () => scrollToBottom(true));

    /* ==========================================================================
       6. REPLY & IMAGE ATTACHMENT CONTROLS
       ========================================================================== */
    function clearReply() {
      replyTarget = null;
      dom.replyPreview.classList.add("hidden");
      dom.replyPreview.classList.remove("flex");
      dom.replyPreviewText.textContent = "";
    }

    function setReplyTarget(msg) {
      replyTarget = {
        id: String(msg.id || ""),
        sender: String(msg.sender || "anon"),
        text: String(msg.text || "").slice(0, 180),
        imageUrl: typeof msg.imageUrl === "string" ? msg.imageUrl : null,
      };
      dom.replyPreviewText.textContent = replyTarget.text || (replyTarget.imageUrl ? "Image" : "Message");
      dom.replyPreview.classList.remove("hidden");
      dom.replyPreview.classList.add("flex");
      dom.messageInput.focus();
    }

    function clearSelectedImage() {
      selectedImage = null;
      dom.imageInput.value = "";
      dom.imagePreviewWrap.classList.add("hidden");
      dom.imagePreviewWrap.classList.remove("flex");
      dom.imagePreview.removeAttribute("src");
      dom.imageName.textContent = "";
      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
      }
    }

    dom.cancelReplyBtn.addEventListener("click", clearReply);
    dom.attachBtn.addEventListener("click", () => dom.imageInput.click());
    dom.removeImageBtn.addEventListener("click", clearSelectedImage);

    dom.imageInput.addEventListener("change", () => {
      const file = dom.imageInput.files?.[0];
      if (!file) return;

      if (!ALLOWED_IMAGE_TYPES.has(file.type)) {
        showToast("Choose a JPG, PNG, WEBP, or GIF image.", true);
        clearSelectedImage();
        return;
      }
      if (file.size > MAX_IMAGE_SIZE) {
        showToast("Image must be 5 MB or smaller.", true);
        clearSelectedImage();
        return;
      }

      selectedImage = file;
      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = URL.createObjectURL(file);
      dom.imagePreview.src = previewObjectUrl;
      dom.imageName.textContent = file.name;
      dom.imagePreviewWrap.classList.remove("hidden");
      dom.imagePreviewWrap.classList.add("flex");
    });

    /* ==========================================================================
       7. MESSAGE RENDERING & SWIPE INTERACTIONS
       ========================================================================== */
    function addMetaLine(container, label, value) {
      const line = document.createElement("div");
      line.className = "meta-line";

      const key = document.createElement("span");
      key.className = "meta-key";
      key.textContent = label;

      const val = document.createElement("span");
      val.className = "meta-value";
      val.textContent = value || "—";

      line.append(key, val);
      container.appendChild(line);
    }

    function attachSwipeToReply(row, bubble, msg) {
      let startX = 0;
      let startY = 0;
      let tracking = false;
      let didSwipe = false;
      const maxDrag = 92;
      const threshold = 64;

      const onStart = (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        if (e.target.closest("button, a, img")) return;
        tracking = true;
        didSwipe = false;
        startX = e.clientX;
        startY = e.clientY;
        bubble.style.transition = "none";
      };

      const onMove = (e) => {
        if (!tracking) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12) {
          tracking = false;
          bubble.style.transform = "";
          return;
        }
        if (dx <= 0) return;

        const currentX = Math.min(dx, maxDrag);
        if (currentX > 8) {
          row.classList.add("swiping");
          bubble.style.transform = `translateX(${currentX}px)`;
          if (currentX >= threshold) didSwipe = true;
        }
      };

      const onFinish = () => {
        if (!tracking) return;
        tracking = false;
        bubble.style.transition = "";
        bubble.style.transform = "";
        row.classList.remove("swiping");

        if (didSwipe) {
          setReplyTarget(msg);
          row.dataset.skipNextClick = "1";
          window.setTimeout(() => delete row.dataset.skipNextClick, 250);
        }
      };

      bubble.addEventListener("pointerdown", onStart);
      bubble.addEventListener("pointermove", onMove);
      bubble.addEventListener("pointerup", onFinish);
      bubble.addEventListener("pointercancel", onFinish);
      bubble.addEventListener("lostpointercapture", onFinish);
    }

    function renderMessages(messages) {
      const isFirstRender = !hasInitialRoomRender;
      const shouldStick = isFirstRender || isNearBottom();
      dom.messagesContainer.innerHTML = "";

      if (!messages.length) {
        const empty = document.createElement("div");
        empty.className = "h-full flex items-center justify-center text-xs text-slate-500";
        empty.textContent = "No messages yet.";
        dom.messagesContainer.appendChild(empty);
        hasInitialRoomRender = true;
        dom.jumpLatestBtn.classList.add("hidden");
        return;
      }

      messages.forEach((msg, idx) => {
        const isMine = msg.sender === clientId;
        const prev = messages[idx - 1];
        const groupedWithPrev =
          prev &&
          prev.sender === msg.sender &&
          typeof msg.ts === "number" &&
          typeof prev.ts === "number" &&
          msg.ts - prev.ts < 90000;

        const row = document.createElement("div");
        row.id = `message-${String(msg.id || "")}`;
        row.className = `message-row relative flex flex-col max-w-xl ${isMine ? "ml-auto items-end" : "items-start"} ${groupedWithPrev ? "-mt-1.5" : ""} ${!renderedMessageIds.has(msg.id) ? "msg-enter" : ""}`;
        if (msg.id) renderedMessageIds.add(msg.id);

        const swipeHint = document.createElement("span");
        swipeHint.className = "message-swipe-hint";
        swipeHint.textContent = "↪";
        row.appendChild(swipeHint);

        const bubble = document.createElement("div");
        bubble.className = `message-bubble group relative ${
          isMine
            ? "bg-[#292629] hover:bg-[#302d30] border border-white/[0.045] text-slate-100 rounded-2xl rounded-br-sm"
            : "bg-surfaceElevated/90 hover:bg-surfaceElevated border border-white/[0.035] text-slate-200 rounded-2xl rounded-bl-sm"
        } px-2.5 py-1.5 text-[12px] leading-[1.5] break-words shadow-none cursor-pointer`;
        bubble.title = "Tap for technical message details · Swipe right to reply";

        // Quoted Reply
        if (msg.replyTo && typeof msg.replyTo === "object") {
          const quote = document.createElement("button");
          quote.type = "button";
          quote.className = "reply-quote";
          quote.title = "Jump to original message";
          quote.setAttribute("aria-label", "Jump to the original message and highlight it");

          if (msg.replyTo.sender === clientId) {
            const quoteAuthor = document.createElement("span");
            quoteAuthor.className = "block text-[9px] font-semibold tracking-wide text-rose-200/80 mb-0.5";
            quoteAuthor.textContent = "You";
            quote.appendChild(quoteAuthor);
          }

          const quoteText = document.createElement("span");
          quoteText.className = "block text-[10px] text-slate-400 line-clamp-2 leading-snug";
          quoteText.textContent = msg.replyTo.text || (msg.replyTo.imageUrl ? "Image" : "Message");
          quote.appendChild(quoteText);

          quote.addEventListener("click", (e) => {
            e.stopPropagation();
            jumpToMessage(msg.replyTo.id);
          });
          bubble.appendChild(quote);
        }

        // Message Text
        if (typeof msg.text === "string" && msg.text.length > 0) {
          const textNode = document.createElement("div");
          appendTextWithLinks(textNode, msg.text, isMine);
          bubble.appendChild(textNode);
        }

        // Attached Image
        if (typeof msg.imageUrl === "string" && /^https:\/\//i.test(msg.imageUrl)) {
          const image = document.createElement("img");
          image.src = msg.imageUrl;
          image.alt = "Shared image";
          image.loading = "lazy";
          image.referrerPolicy = "no-referrer";
          image.className = "mt-1 max-w-[40%] max-h-28 rounded-lg object-contain cursor-zoom-in";
          image.addEventListener("click", (e) => {
            e.stopPropagation();
            window.open(msg.imageUrl, "_blank", "noopener,noreferrer");
          });
          bubble.appendChild(image);
        }

        // Basic Metadata Row
        const basicMeta = document.createElement("div");
        basicMeta.className = "message-basic-meta items-center gap-2 mt-1.5 text-[10px] text-slate-500/80";

        if (isMine) {
          const sender = document.createElement("span");
          sender.textContent = "You";
          basicMeta.appendChild(sender);
        }

        const time = document.createElement("span");
        time.className = "tabular-nums select-none";
        time.dataset.ts = msg.ts ? String(msg.ts) : "";
        time.textContent = msg.ts ? formatRelativeTime(msg.ts) : "";
        basicMeta.appendChild(time);
        bubble.appendChild(basicMeta);

        // Expanded Technical Details
        const details = document.createElement("div");
        details.className = "message-details mt-2 pt-2 border-t border-white/[0.06] text-[10px] font-mono";
        addMetaLine(details, "Message ID", msg.id ? String(msg.id) : "Local message");
        addMetaLine(details, "Sender ID", msg.sender ? String(msg.sender) : "Unknown");
        addMetaLine(details, "Local time", msg.ts ? new Date(msg.ts).toLocaleString() : "Unavailable");
        addMetaLine(details, "UTC time", msg.ts ? new Date(msg.ts).toISOString() : "Unavailable");
        addMetaLine(details, "Unix time", msg.ts ? String(msg.ts) : "Unavailable");
        addMetaLine(
          details,
          "Payload",
          `${(msg.text || "").length} text chars${msg.imageUrl ? " · image attached" : ""}${msg.replyTo ? " · reply" : ""}`
        );

        const actions = document.createElement("div");
        actions.className = "flex items-center justify-end gap-3 mt-2 pt-1 border-t border-white/[0.06] text-[10px] text-slate-500";

        if (msg.text) {
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "hover:text-slate-300 transition-colors";
          copyBtn.textContent = "Copy";
          copyBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const copied = copyTextToClipboard(msg.text);
            showToast(copied ? "Message copied" : "Could not copy here — select the text", !copied);
          });
          actions.appendChild(copyBtn);
        }

        const replyBtn = document.createElement("button");
        replyBtn.type = "button";
        replyBtn.className = "hover:text-rose-200/80 transition-colors";
        replyBtn.textContent = "↩ Reply";
        replyBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          setReplyTarget(msg);
        });
        actions.appendChild(replyBtn);

        details.appendChild(actions);
        bubble.appendChild(details);

        bubble.addEventListener("click", (e) => {
          if (row.dataset.skipNextClick === "1") {
            delete row.dataset.skipNextClick;
            return;
          }
          if (e.target instanceof HTMLImageElement || e.target.closest("a, button")) return;
          row.classList.toggle("is-expanded");
        });

        attachSwipeToReply(row, bubble, msg);
        row.appendChild(bubble);
        dom.messagesContainer.appendChild(row);
      });

      hasInitialRoomRender = true;
      const lastMsg = messages[messages.length - 1];
      if (shouldStick || lastMsg?.sender === clientId) {
        scrollToBottom(false);
        if (isFirstRender) {
          requestAnimationFrame(() => requestAnimationFrame(() => scrollToBottom(false)));
        }
      } else {
        dom.jumpLatestBtn.classList.remove("hidden");
      }
    }

    // Keep relative timestamps fresh
    window.setInterval(() => {
      document.querySelectorAll("[data-ts]").forEach((el) => {
        const ts = Number(el.dataset.ts);
        if (ts) el.textContent = formatRelativeTime(ts);
      });
    }, 1000);

    /* ==========================================================================
       8. LIVE ONLINE PRESENCE (GHOST PING SYSTEM — ZERO FLUCTUATION)
       ========================================================================== */
    function isGhostPingRecord(item) {
      if (!item || typeof item !== "object") return false;
      if (item.ghost === true) return true;
      if (typeof item.id === "string" && item.id.startsWith("ghost_")) return true;
      if (typeof item.text === "string") {
        const stripped = item.text.replace(/\u200b/g, "").trim();
        if (item.text.includes("\u200b") && stripped.length === 0) return true;
      }
      return false;
    }

    function updateOnlineCounter() {
      const now = getServerNow();
      const uniqueViewers = new Set();

      for (const ghost of activeGhostEntries) {
        const ts = Number(ghost.ts);
        if (!Number.isFinite(ts) || now - ts > PRESENCE_STALE_MS) continue;

        const sessionKey = ghost.session || ghost.id;
        if (sessionKey) uniqueViewers.add(String(sessionKey));
      }

      if (db && document.visibilityState === "visible") {
        uniqueViewers.add(TAB_SESSION_ID);
      }

      dom.onlineCount.textContent = String(Math.max(1, uniqueViewers.size));
    }

    function initGhostPresence() {
      if (!db) return;

      const ownGhostKey = `ghost_${TAB_SESSION_ID}`;
      const ghostRef = ref(db, `rooms/${ROOM_ID}/${ownGhostKey}`);
      const connectedRef = ref(db, ".info/connected");
      const offsetRef = ref(db, ".info/serverTimeOffset");

      onValue(offsetRef, (snap) => {
        const offset = snap.val();
        if (typeof offset === "number" && Number.isFinite(offset)) {
          serverTimeOffsetMs = offset;
          updateOnlineCounter();
        }
      });

      const sendGhostPing = async () => {
        if (!db || document.visibilityState !== "visible") return;
        try {
          await set(ghostRef, {
            sender: String(clientId).slice(0, 40),
            session: TAB_SESSION_ID,
            text: GHOST_PING_TEXT,
            ts: serverTimestamp(),
            ghost: true,
          });
        } catch (err) {
          console.warn("Presence ping failed:", err);
        }
      };

      const clearGhostPing = () => {
        remove(ghostRef).catch(() => {});
      };

      onValue(connectedRef, async (snap) => {
        if (snap.val() !== true) {
          setConnectionStatus("connecting");
          return;
        }
        setConnectionStatus("live");
        try {
          await onDisconnect(ghostRef).remove();
          await sendGhostPing();
        } catch (err) {
          console.warn("onDisconnect registration failed:", err);
        }
      });

      const heartbeatTimer = window.setInterval(sendGhostPing, PRESENCE_PING_MS);
      const sweepTimer = window.setInterval(updateOnlineCounter, 5000);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          sendGhostPing();
          updateOnlineCounter();
        } else {
          clearGhostPing();
        }
      });

      window.addEventListener("online", sendGhostPing);
      window.addEventListener(
        "pagehide",
        () => {
          window.clearInterval(heartbeatTimer);
          window.clearInterval(sweepTimer);
          clearGhostPing();
        },
        { once: true }
      );
    }

    /* ==========================================================================
       9. FIREBASE INITIALIZATION & ROOM SUBSCRIPTION
       ========================================================================== */
    function subscribeToRoom(room) {
      if (typeof unsubscribeRoom === "function") {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }

      const roomRef = ref(db, `rooms/${room}`);

      const handleSnapshot = (snapshot) => {
        const raw = snapshot.val() || {};
        const ghosts = [];
        const visibleMessages = [];

        const sortedEntries = Object.entries(raw)
          .filter(([, data]) => data && typeof data === "object")
          .map(([id, data]) => ({ id, ...data }))
          .sort((a, b) => (Number(a.ts) || 0) - (Number(b.ts) || 0));

        for (const item of sortedEntries) {
          if (isGhostPingRecord(item)) {
            ghosts.push(item);
            continue;
          }

          const cleanText = typeof item.text === "string"
            ? item.text.replace(/\u200b/g, "").trim()
            : "";
          const hasImage = typeof item.imageUrl === "string" && item.imageUrl.trim().length > 0;

          if (cleanText.length > 0 || hasImage) {
            visibleMessages.push({
              ...item,
              text: cleanText,
            });
          }
        }

        activeGhostEntries = ghosts;
        updateOnlineCounter();
        renderMessages(visibleMessages);
        setConnectionStatus("live");
      };

      const handleError = (err) => {
        console.error("Room subscription error:", err);
        setConnectionStatus("error");
        showToast(`Firebase read error: ${err.code || err.message}`, true);
      };

      onValue(roomRef, handleSnapshot, handleError);
      unsubscribeRoom = () => off(roomRef, "value", handleSnapshot);
    }

    async function initBackend() {
      try {
        setConnectionStatus("connecting");
        const app = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);

        db = getDatabase(app, FIREBASE_CONFIG.databaseURL);
        subscribeToRoom(ROOM_ID);

        const credential = await signInAnonymously(auth);
        clientId = credential.user.uid;
        initGhostPresence();
      } catch (err) {
        console.error("Firebase initialization failed:", err);
        setConnectionStatus("error");
        showToast(`Firebase error: ${err.code || err.message || "Initialization failed"}`, true);
      }
    }

    /* ==========================================================================
       10. MESSAGE SUBMISSION & IMAGE UPLOAD
       ========================================================================== */
    dom.messageInput.addEventListener("input", () => {
      dom.messageInput.style.height = "auto";
      dom.messageInput.style.height = `${Math.min(dom.messageInput.scrollHeight, 128)}px`;
    });

    dom.messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        dom.messageForm.requestSubmit();
      }
    });

    async function uploadImageToImgBB(file) {
      if (!ALLOWED_IMAGE_TYPES.has(file.type) || file.size > MAX_IMAGE_SIZE) {
        throw new Error("Invalid image. Use JPG, PNG, WEBP, or GIF up to 5 MB.");
      }

      const formData = new FormData();
      formData.append("image", file);
      formData.append("name", file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-80));

      showToast("Uploading image...");
      const response = await fetch(
        `https://api.imgbb.com/1/upload?key=${encodeURIComponent(IMGBB_API_KEY)}`,
        { method: "POST", body: formData }
      );

      const result = await response.json().catch(() => null);
      if (!response.ok || !result?.success || !result?.data?.url) {
        throw new Error(result?.error?.message || `Image upload failed (${response.status})`);
      }

      return result.data.url;
    }

    dom.messageForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const rawText = dom.messageInput.value.trim();
      const imageFile = selectedImage;
      if (!rawText && !imageFile) return;

      if (!db) {
        showToast("Not connected yet. Please wait a moment.", true);
        return;
      }

      if (rawText && !profanityFilter) {
        showToast(
          profanityFilterLoadFailed
            ? "Word filter unavailable. Reload and try again."
            : "Word filter is still loading. Try again shortly.",
          true
        );
        return;
      }

      const now = Date.now();
      if (now - lastSentAt < COOLDOWN_MS) {
        const waitSec = ((COOLDOWN_MS - (now - lastSentAt)) / 1000).toFixed(1);
        showToast(`Wait ${waitSec}s`, true);
        return;
      }

      const filteredText = rawText && profanityFilter ? profanityFilter.clean(rawText, "*") : "";
      const wasFiltered = filteredText !== rawText;

      dom.sendBtn.disabled = true;
      dom.attachBtn.disabled = true;

      try {
        const imageUrl = imageFile ? await uploadImageToImgBB(imageFile) : null;

        const payload = {
          sender: String(clientId).slice(0, 40),
          text: filteredText.slice(0, 500),
          ts: serverTimestamp(),
        };
        if (imageUrl) payload.imageUrl = imageUrl;
        if (replyTarget) {
          payload.replyTo = {
            id: replyTarget.id,
            sender: replyTarget.sender,
            text: replyTarget.text,
            imageUrl: replyTarget.imageUrl || null,
          };
        }

        await push(ref(db, `rooms/${ROOM_ID}`), payload);

        if (wasFiltered) showToast("Some words were replaced with *.");
        lastSentAt = Date.now();
        dom.messageInput.value = "";
        dom.messageInput.style.height = "auto";
        clearSelectedImage();
        clearReply();
      } catch (err) {
        console.error("Message send failed:", err);
        showToast(err.code ? `${err.code}: ${err.message}` : err.message || "Message failed to send.", true);
      } finally {
        dom.sendBtn.disabled = false;
        dom.attachBtn.disabled = false;
      }
    });

    /* ==========================================================================
       11. BOOTSTRAP
       ========================================================================== */
    loadProfanityFilter();
    initBackend();
  </script>
