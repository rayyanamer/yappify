<!doctype html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191c20">
<title>yappify</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191c20'/%3E%3Cpath d='M16 7C10.48 7 6 10.58 6 15c0 2.3 1.22 4.38 3.18 5.83L8 25l4.67-1.56C13.78 23.75 14.86 24 16 24c5.52 0 10-3.58 10-8s-4.48-8-10-8z' fill='none' stroke='%23a8383b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='15' r='1' fill='%23e2b5b2'/%3E%3Ccircle cx='16' cy='15' r='1' fill='%23e2b5b2'/%3E%3Ccircle cx='20' cy='15' r='1' fill='%23e2b5b2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://yappify-b9b5e-default-rtdb.asia-southeast1.firebasedatabase.app" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>yapp<span class="brand-mark">ı<span class="status-dot" id="status-dot" title="Connecting"></span></span>ffy</h1>
    <span class="brand-sub">by <a class="author-link" href="https://rayyanamer.github.io/" rel="noopener noreferrer" target="_blank">Rayyan</a></span>
  </div>
  <div class="online-wrap">
    <button type="button" class="online" title="Room status, theme & database stats" id="online-toggle" aria-controls="status-dock" aria-expanded="false">
      <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-3.005 0-9 1.508-9 4.5V20.5a.5.5 0 0 0 .5.5h17a.5.5 0 0 0 .5-.5v-1.75c0-2.992-5.995-4.5-9-4.5Z"/></svg>
      <span id="online-count">0</span>
    </button>
    <div class="status-dock" id="status-dock" aria-label="Room status and database stats" role="region">
      <div class="dock-header">
        <div class="dock-online-label">
          <span class="dock-live-dot"></span>
          <span>Online : <strong id="dock-online-count" style="color:var(--bright)">0</strong></span>
        </div>
        <div class="theme-swatches" aria-label="Theme selector" role="group">
          <button type="button" class="theme-swatch active" aria-label="Original Crimson theme" title="Original Crimson" data-theme-id="og" style="--swatch-bg:linear-gradient(135deg,#a8383b 50%,#e2b5b2 50%);--swatch-ring:#a8383b"></button>
          <button type="button" class="theme-swatch" aria-label="Lime Green theme" title="Lime Green" data-theme-id="lime" style="--swatch-bg:linear-gradient(135deg,#65a30d 50%,#d9f99d 50%);--swatch-ring:#65a30d"></button>
          <button type="button" class="theme-swatch" aria-label="Cobalt Blue theme" title="Cobalt Blue" data-theme-id="cobalt" style="--swatch-bg:linear-gradient(135deg,#2563eb 50%,#bfdbfe 50%);--swatch-ring:#2563eb"></button>
          <button type="button" class="theme-swatch" aria-label="Amber Gold theme" title="Amber Gold" data-theme-id="amber" style="--swatch-bg:linear-gradient(135deg,#d97706 50%,#fde68a 50%);--swatch-ring:#d97706"></button>
        </div>
      </div>
      <div class="dock-stats">
        <div class="stat-row"><span class="stat-key">Region</span><span class="stat-val">asia-southeast1</span></div>
        <div class="stat-row"><span class="stat-key">Room</span><span class="stat-val" id="stat-room">public-lobby</span></div>
        <div class="stat-row"><span class="stat-key">Loaded msgs</span><span class="stat-val" id="stat-msgs">0 / 250</span></div>
        <div class="stat-row"><span class="stat-key">Payload est.</span><span class="stat-val" id="stat-size">0 KB</span></div>
        <div class="stat-row"><span class="stat-key">Clock skew</span><span class="stat-val" id="stat-offset">0 ms</span></div>
        <div class="stat-row"><span class="stat-key">Session UID</span><span class="stat-val" id="stat-uid">connecting...</span></div>
      </div>
    </div>
  </div>
</header>

<div class="toast-container" id="toasts" aria-live="polite"></div>

<section class="chat-shell">
  <main aria-live="polite" id="messages">
    <div class="loading"><span class="loader"><span>.</span><span>.</span><span>.</span></span></div>
  </main>
  <button type="button" id="latest" hidden>↓ Latest</button>
</section>

<footer>
  <form id="composer">
    <input accept="image/jpeg,image/png,image/webp,image/gif" hidden id="image-file" type="file">
    <button type="button" class="icon-btn" aria-label="Attach image" title="Attach image (max 5 MB)" id="attach">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect height="18" rx="3" width="18" x="3" y="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    </button>
    <div class="compose-box">
      <div class="preview-row" id="reply-preview" hidden>
        <div style="min-width:0;flex:1"><div class="preview-label">Replying to</div><div id="reply-text"></div></div>
        <button type="button" class="text-btn" aria-label="Cancel reply" id="cancel-reply">×</button>
      </div>
      <div class="preview-row" id="image-preview-wrap" hidden>
        <img alt="Selected image preview" id="image-preview">
        <span id="image-name"></span>
        <button type="button" class="text-btn" id="remove-image">Remove</button>
      </div>
      <textarea aria-label="Message" id="message-input" maxlength="500" placeholder="Message..." rows="1"></textarea>
    </div>
    <button type="submit" class="icon-btn" aria-label="Send message" id="send">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </form>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
