<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191c20">
  <title>yappify</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://yappify-b9b5e-default-rtdb.asia-southeast1.firebasedatabase.app" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Base Theme Variables (Original Crimson) */
    :root{
      color-scheme:dark;
      --bg:#131518;
      --surface:#191c20;
      --raised:#21252b;
      --line:#2c313a;
      --accent:#a8383b;
      --accent-hover:#8f2e31;
      --soft:#d6a0a0;
      --bright:#e2b5b2;
      --muted:#77808d;
      --icon-tint:#fb7185;
      --icon-glow:rgba(244,114,182,.25);
      --bg-glow:rgba(168,56,59,.1);
      --author-hover:#f0c7c3;
      --author-glow:rgba(214,160,160,.22);
      --mine-bg:#292629;
      --mine-hover:#302d30;
      --accent-border:rgba(168,56,59,.7);
      --accent-border-focus:rgba(168,56,59,.6);
      --send-shadow:rgba(168,56,59,.18);
      --send-shadow-hover:rgba(168,56,59,.28);
      --soft-border:rgba(214,160,160,.2);
      --quote-border:rgba(226,181,178,.48);
      --quote-border-hover:rgba(226,181,178,.95);
      --quote-hover-bg:rgba(214,160,160,.1);
      --quote-author:rgba(251,207,232,.8);
      --pulse-color:rgba(214,160,160,.2);
      --jump-bg:rgba(45,31,34,.92);
      --jump-border:rgba(226,181,178,.28);
      --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace
    }

    /* Lime Green Theme Overrides */
    [data-theme="lime"]{
      --accent:#65a30d;
      --accent-hover:#4d7c0f;
      --soft:#bef264;
      --bright:#d9f99d;
      --icon-tint:#a3e635;
      --icon-glow:rgba(163,230,53,.28);
      --bg-glow:rgba(101,163,13,.12);
      --author-hover:#ecfccb;
      --author-glow:rgba(190,242,100,.25);
      --mine-bg:#232922;
      --mine-hover:#293128;
      --accent-border:rgba(132,204,22,.65);
      --accent-border-focus:rgba(132,204,22,.55);
      --send-shadow:rgba(101,163,13,.2);
      --send-shadow-hover:rgba(101,163,13,.32);
      --soft-border:rgba(190,242,100,.24);
      --quote-border:rgba(217,249,157,.48);
      --quote-border-hover:rgba(217,249,157,.95);
      --quote-hover-bg:rgba(190,242,100,.1);
      --quote-author:rgba(217,249,157,.85);
      --pulse-color:rgba(190,242,100,.2);
      --jump-bg:rgba(33,43,28,.92);
      --jump-border:rgba(217,249,157,.28);
    }

    /* Cobalt Blue Theme Overrides */
    [data-theme="cobalt"]{
      --accent:#2563eb;
      --accent-hover:#1d4ed8;
      --soft:#93c5fd;
      --bright:#bfdbfe;
      --icon-tint:#60a5fa;
      --icon-glow:rgba(96,165,250,.28);
      --bg-glow:rgba(37,99,235,.12);
      --author-hover:#dbeafe;
      --author-glow:rgba(147,197,253,.25);
      --mine-bg:#202631;
      --mine-hover:#262e3c;
      --accent-border:rgba(59,130,246,.65);
      --accent-border-focus:rgba(59,130,246,.55);
      --send-shadow:rgba(37,99,235,.22);
      --send-shadow-hover:rgba(37,99,235,.34);
      --soft-border:rgba(147,197,253,.24);
      --quote-border:rgba(191,219,254,.48);
      --quote-border-hover:rgba(191,219,254,.95);
      --quote-hover-bg:rgba(147,197,253,.1);
      --quote-author:rgba(191,219,254,.85);
      --pulse-color:rgba(147,197,253,.2);
      --jump-bg:rgba(28,35,48,.92);
      --jump-border:rgba(191,219,254,.28);
    }

    /* Amber Gold Theme Overrides */
    [data-theme="amber"]{
      --accent:#d97706;
      --accent-hover:#b45309;
      --soft:#fcd34d;
      --bright:#fde68a;
      --icon-tint:#fbbf24;
      --icon-glow:rgba(251,191,36,.28);
      --bg-glow:rgba(217,119,6,.11);
      --author-hover:#fef3c7;
      --author-glow:rgba(252,211,77,.25);
      --mine-bg:#2b261f;
      --mine-hover:#342e25;
      --accent-border:rgba(245,158,11,.65);
      --accent-border-focus:rgba(245,158,11,.55);
      --send-shadow:rgba(217,119,6,.2);
      --send-shadow-hover:rgba(217,119,6,.32);
      --soft-border:rgba(252,211,77,.24);
      --quote-border:rgba(253,230,138,.48);
      --quote-border-hover:rgba(253,230,138,.95);
      --quote-hover-bg:rgba(252,211,77,.1);
      --quote-author:rgba(253,230,138,.85);
      --pulse-color:rgba(252,211,77,.2);
      --jump-bg:rgba(43,36,24,.92);
      --jump-border:rgba(253,230,138,.28);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:radial-gradient(ellipse at 50% -18%,var(--bg-glow),transparent 48%);color:#e2e8f0;font-family:var(--mono);-webkit-font-smoothing:antialiased;transition:background-image .3s ease}
    button,textarea{font:inherit}
    button{color:inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    a{color:inherit}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
    ::-webkit-scrollbar-thumb:hover{background:#3a414d}

    header{position:relative;z-index:30;min-height:58px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;background:rgba(25,28,32,.95);border-bottom:1px solid rgba(170,180,194,.1);box-shadow:0 8px 28px rgba(0,0,0,.1);backdrop-filter:blur(14px)}
    .brand{display:flex;flex-direction:column;align-items:flex-end;min-width:0}
    .brand h1{margin:0;font-size:17px;line-height:1;letter-spacing:-.075em;font-weight:600;color:#e2e8f0}
    .brand-sub{margin-top:5px;font-size:9px;line-height:1;color:#647080}
    .author-link{color:var(--soft);text-decoration:none;font-weight:600;transition:color .16s,text-shadow .16s}
    .author-link:hover{color:var(--author-hover);text-shadow:0 0 16px var(--author-glow)}
    .brand-mark{position:relative;display:inline-block}
    .status-dot{position:absolute;width:3px;height:3px;left:50%;top:1px;transform:translateX(-50%);border-radius:50%;background:#fcd34d;transition:background .2s}

    /* Seamless Connected Online Trigger & Dock */
    .online-wrap{position:relative;display:flex;align-items:center}
    .online{position:relative;z-index:2;display:flex;align-items:center;gap:6px;flex:none;padding:6px 11px;border:1px solid transparent;border-radius:11px;background:transparent;font-size:12px;color:#cbd5e1;transition:background .18s ease,border-color .18s ease,border-radius .18s ease}
    .online:hover{background:rgba(33,37,43,.65);border-color:rgba(170,180,194,.12)}
    .online[aria-expanded="true"]{background:var(--surface);border-color:rgba(170,180,194,.14);border-bottom-color:transparent;border-bottom-left-radius:0;border-bottom-right-radius:0}
    .online svg{width:14px;height:14px;color:var(--icon-tint);filter:drop-shadow(0 0 6px var(--icon-glow));transition:color .25s,filter .25s}
    #online-count{min-width:18px;text-align:center;color:var(--bright);font-weight:500;font-variant-numeric:tabular-nums;transition:color .25s}

    /* Subtle Spring-Unfold Dock Animation */
    .status-dock{position:absolute;top:calc(100% - 1px);right:0;z-index:1;width:254px;padding:12px 14px;border:1px solid rgba(170,180,194,.14);border-radius:14px 0 14px 14px;background:rgba(25,28,32,.98);box-shadow:0 16px 40px rgba(0,0,0,.48);backdrop-filter:blur(18px);opacity:0;visibility:hidden;pointer-events:none;clip-path:inset(0 0 100% 0 round 14px 0 14px 14px);transform:translateY(-6px) scale(.985);transform-origin:top right;transition:opacity .24s cubic-bezier(.22,1,.36,1),transform .28s cubic-bezier(.22,1,.36,1),clip-path .28s cubic-bezier(.22,1,.36,1),visibility .24s}
    .status-dock.open{opacity:1;visibility:visible;pointer-events:auto;clip-path:inset(0 0 0% 0 round 14px 0 14px 14px);transform:translateY(0) scale(1)}
    .dock-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06);opacity:0;transform:translateY(-4px);transition:opacity .2s ease,transform .24s cubic-bezier(.22,1,.36,1)}
    .status-dock.open .dock-header{opacity:1;transform:translateY(0);transition-delay:.05s}
    .dock-online-label{font-size:11px;font-weight:500;color:#cbd5e1;display:flex;align-items:center;gap:6px}
    .dock-live-dot{width:6px;height:6px;border-radius:50%;background:var(--icon-tint);box-shadow:0 0 8px var(--icon-tint);transition:background .25s,box-shadow .25s}

    /* Circular Theme Swatches */
    .theme-swatches{display:flex;align-items:center;gap:6px}
    .theme-swatch{width:16px;height:16px;padding:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);background:var(--swatch-bg);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s;flex:none}
    .theme-swatch:hover{transform:scale(1.18);border-color:rgba(255,255,255,.55)}
    .theme-swatch.active{transform:scale(1.14);border-color:#fff;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--swatch-ring)}

    /* DB Stats Grid inside Dock */
    .dock-stats{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:10px;opacity:0;transform:translateY(-4px);transition:opacity .22s ease,transform .26s cubic-bezier(.22,1,.36,1)}
    .status-dock.open .dock-stats{opacity:1;transform:translateY(0);transition-delay:.09s}
    .stat-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .stat-key{color:var(--muted)}
    .stat-val{color:#cbd5e1;font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:135px}

    .toast-container{position:fixed;z-index:20;top:68px;right:12px;width:min(calc(100vw - 24px),320px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
    .toast{max-width:100%;padding:8px 11px;border:1px solid rgba(170,180,194,.1);border-radius:9px;background:rgba(25,28,32,.9);color:rgba(225,228,234,.94);font-size:10px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.14);backdrop-filter:blur(10px);opacity:0;transform:translateY(-4px);transition:opacity .16s,transform .16s}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.error{color:#e2bfc1;border-color:rgba(185,107,112,.25)}
    .chat-shell{position:relative;display:flex;flex:1;min-height:0;flex-direction:column}
    #messages{width:100%;max-width:960px;margin:0 auto;padding:20px clamp(16px,4vw,36px);flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;display:flex;flex-direction:column;gap:12px}
    .loading,.empty{height:100%;min-height:100%;display:grid;place-items:center;color:#77808d;font-size:12px}
    .loader{display:inline-flex;gap:3px;font-weight:600;letter-spacing:.08em}
    .loader span{animation:pulse 1.2s ease-in-out infinite}
    .loader span:nth-child(2){animation-delay:.16s}.loader span:nth-child(3){animation-delay:.32s}
    @keyframes pulse{0%,100%{opacity:.28;transform:translateY(0) scale(.92);color:#77808d}50%{opacity:1;transform:translateY(-2px) scale(1.12);color:var(--bright);text-shadow:0 0 10px var(--author-glow)}}
    .message-row{position:relative;display:flex;flex-direction:column;max-width:min(78%,560px);touch-action:pan-y;scroll-margin-block:42vh}
    .message-row.mine{align-self:flex-end;align-items:flex-end}.message-row.other{align-self:flex-start;align-items:flex-start}
    .message-row.grouped{margin-top:-6px}

    /* Subtle Day-to-Day Date Separator */
    .date-divider{display:flex;align-items:center;gap:12px;margin:12px 0 6px;color:var(--muted);font-size:9px;letter-spacing:.08em;user-select:none}
    .date-divider:first-child{margin-top:0}
    .date-divider::before,.date-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(170,180,194,.12),transparent)}
    .date-divider span{color:rgba(148,163,184,.65);font-variant-numeric:tabular-nums}

    .message-bubble{position:relative;max-width:100%;padding:6px 10px;border:1px solid rgba(255,255,255,.035);border-radius:16px;line-height:1.55;font-size:12px;overflow-wrap:anywhere;box-shadow:0 4px 14px rgba(0,0,0,.09);transition:transform .13s,background .15s,border-color .15s;cursor:pointer}
    .mine .message-bubble{background:var(--mine-bg);border-color:rgba(255,255,255,.045);color:#f1f5f9;border-bottom-right-radius:4px}
    .mine .message-bubble:hover{background:var(--mine-hover)}
    .other .message-bubble{background:rgba(33,37,43,.9);color:#e2e8f0;border-bottom-left-radius:4px}
    .other .message-bubble:hover{background:#21252b}
    .message-row.expanded .message-bubble{border-color:var(--soft-border);box-shadow:0 8px 24px rgba(0,0,0,.16)}
    .basic-meta{display:flex;align-items:center;gap:8px;margin-top:6px;color:rgba(119,128,141,.9);font-size:10px}
    .message-details{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:10px}
    .expanded .message-details{display:block}.expanded .basic-meta{display:none}
    .meta-line{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
    .meta-key{color:#77808d}.meta-value{color:#aeb5bf;text-align:right;overflow-wrap:anywhere;user-select:text}
    .actions{display:flex;justify-content:flex-end;gap:13px;margin-top:8px;padding-top:5px;border-top:1px solid rgba(255,255,255,.06);color:#77808d;font-size:10px}
    .actions button{padding:0;border:0;background:none;color:inherit}.actions button:hover{color:var(--bright)}
    .reply-quote{display:block;width:100%;margin:0 0 7px;padding:6px 9px;text-align:left;border:0;border-left:2px solid var(--quote-border);border-radius:0 8px 8px 0;background:rgba(0,0,0,.16);transition:background .15s,border-color .15s,transform .15s}
    .reply-quote:hover{background:var(--quote-hover-bg);border-left-color:var(--quote-border-hover);transform:translateX(2px)}
    .quote-author{display:block;margin-bottom:2px;color:var(--quote-author);font-size:9px;font-weight:600}
    .quote-text{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#94a3b8;font-size:10px;line-height:1.35}
    .message-image{display:block;max-width:min(240px,55vw);max-height:180px;margin-top:5px;border-radius:8px;object-fit:contain;cursor:zoom-in}
    .swipe-hint{position:absolute;left:-27px;top:50%;transform:translateY(-50%);opacity:0;color:var(--quote-author);pointer-events:none;transition:opacity .12s}
    .message-row.swiping .swipe-hint{opacity:1}
    .message-jump-highlight .message-bubble{z-index:2;animation:messagePulse 2.8s ease-out both}
    .message-jump-highlight:before{content:"ORIGINAL MESSAGE";align-self:flex-start;margin:0 0 6px 7px;padding:3px 7px;border:1px solid var(--jump-border);border-radius:6px;background:var(--jump-bg);color:var(--bright);font-size:8px;font-weight:600;letter-spacing:.09em}
    @keyframes messagePulse{0%,22%{outline:2px solid var(--bright);outline-offset:3px;background-color:var(--pulse-color);box-shadow:0 0 0 6px rgba(255,255,255,.04),0 0 30px var(--pulse-color);transform:scale(1.012)}100%{outline-color:transparent;outline-offset:8px;background-color:transparent;box-shadow:0 0 0 6px transparent,0 0 30px transparent;transform:scale(1)}}
    #latest{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(33,37,43,.96);color:#e2e8f0;font-size:11px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
    #latest[hidden]{display:none}
    footer{flex:none;padding:12px;background:rgba(25,28,32,.94);border-top:1px solid rgba(170,180,194,.1);box-shadow:0 -10px 30px rgba(0,0,0,.12);backdrop-filter:blur(14px)}
    #composer{display:flex;align-items:center;gap:8px;width:100%;max-width:760px;margin:auto}
    .icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:16px;background:var(--raised);color:#cbd5e1;transition:border-color .16s,background .16s,transform .16s}
    .icon-btn:hover{border-color:var(--accent-border)}
    .icon-btn svg{width:16px;height:16px}
    #send{background:var(--accent);border-color:transparent;color:white;box-shadow:0 3px 12px var(--send-shadow);transition:background .2s,box-shadow .2s}
    #send:hover{background:var(--accent-hover);box-shadow:0 4px 16px var(--send-shadow-hover)}
    .compose-box{display:flex;flex:1;min-width:0;flex-direction:column;padding:8px 14px;border:1px solid var(--line);border-radius:16px;background:var(--raised);transition:border-color .16s}
    .compose-box:focus-within{border-color:var(--accent-border-focus)}
    #message-input{display:block;width:100%;max-height:128px;min-height:22px;padding:0;border:0;outline:0;resize:none;background:transparent;color:#f5f5f5;font:12px/1.6 var(--mono);caret-color:var(--bright)}
    #message-input::placeholder{color:#737b88}
    .preview-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
    .preview-row[hidden]{display:none}
    #reply-preview{padding-left:8px;border-left:2px solid var(--quote-border)}
    .preview-label{color:var(--quote-author);font-size:10px}
    #reply-text{overflow:hidden;color:#94a3b8;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    #image-preview{width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:8px;object-fit:cover}
    #image-name{flex:1;min-width:0;overflow:hidden;color:#94a3b8;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    .text-btn{border:0;background:none;color:var(--icon-tint);font-size:11px}
    button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
    @media(min-width:900px){#messages{padding-top:28px;padding-bottom:28px}footer{padding-top:16px;padding-bottom:18px}}
    @media(max-width:520px){.message-row{max-width:88%}#messages{gap:10px}.message-image{max-width:min(210px,62vw)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>yapp<span class="brand-mark">ı<span id="status-dot" class="status-dot" title="Connecting"></span></span>ffy</h1>
      <span class="brand-sub">by <a class="author-link" href="https://rayyanamer.github.io/" target="_blank" rel="noopener noreferrer">Rayyan</a></span>
    </div>

    <div class="online-wrap">
      <button id="online-toggle" class="online" type="button" aria-expanded="false" aria-controls="status-dock" title="Room status, theme & database stats">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-3.005 0-9 1.508-9 4.5V20.5a.5.5 0 0 0 .5.5h17a.5.5 0 0 0 .5-.5v-1.75c0-2.992-5.995-4.5-9-4.5Z"/></svg>
        <span id="online-count">0</span>
      </button>

      <!-- Expandable Dock -->
      <div id="status-dock" class="status-dock" role="region" aria-label="Room status and database stats">
        <div class="dock-header">
          <div class="dock-online-label">
            <span class="dock-live-dot"></span>
            <span>Online : <strong id="dock-online-count" style="color:var(--bright)">0</strong></span>
          </div>
          <div class="theme-swatches" role="group" aria-label="Theme selector">
            <button class="theme-swatch active" type="button" data-theme-id="og" style="--swatch-bg:linear-gradient(135deg,#a8383b 50%,#e2b5b2 50%);--swatch-ring:#a8383b" title="Original Crimson" aria-label="Original Crimson theme"></button>
            <button class="theme-swatch" type="button" data-theme-id="lime" style="--swatch-bg:linear-gradient(135deg,#65a30d 50%,#d9f99d 50%);--swatch-ring:#65a30d" title="Lime Green" aria-label="Lime Green theme"></button>
            <button class="theme-swatch" type="button" data-theme-id="cobalt" style="--swatch-bg:linear-gradient(135deg,#2563eb 50%,#bfdbfe 50%);--swatch-ring:#2563eb" title="Cobalt Blue" aria-label="Cobalt Blue theme"></button>
            <button class="theme-swatch" type="button" data-theme-id="amber" style="--swatch-bg:linear-gradient(135deg,#d97706 50%,#fde68a 50%);--swatch-ring:#d97706" title="Amber Gold" aria-label="Amber Gold theme"></button>
          </div>
        </div>

        <div class="dock-stats">
          <div class="stat-row">
            <span class="stat-key">Region</span>
            <span class="stat-val">asia-southeast1</span>
          </div>
          <div class="stat-row">
            <span class="stat-key">Room</span>
            <span class="stat-val" id="stat-room">public-lobby</span>

  <div id="toasts" class="toast-container" aria-live="polite"></div>

  <section class="chat-shell">
    <main id="messages" aria-live="polite">
      <div class="loading"><span class="loader"><span>.</span><span>.</span><span>.</span></span></div>

  <footer>

      </button>
    </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getDatabase, ref, push, set, remove, onValue, onDisconnect, serverTimestamp, query, limitToLast
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAn06v2-5QKASkAObavHcbmofg39Wm8V-c",
      authDomain: "yappify-b9b5e.firebaseapp.com",
      databaseURL: "https://yappify-b9b5e-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "yappify-b9b5e",
      storageBucket: "yappify-b9b5e.firebasestorage.app",
      messagingSenderId: "397289116851",
      appId: "1:397289116851:web:0800b4ae59d77220308cc6"
    };

    const ROOM = "public-lobby";
    const IMAGE_HOST_KEY = "726fbbd12de1823c568d55f0be750282";
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
    const MAX_MESSAGES = 250;
    const HEARTBEAT_MS = 12000;
    const STALE_MS = 35000;
    const SEND_COOLDOWN_MS = 2500;
    const allowedImages = new Set(["image/jpeg", "image/png", "image/webp", "image/gif"]);

    const $ = id => document.getElementById(id);
    const ui = {
      messages: $("messages"), latest: $("latest"), form: $("composer"), input: $("message-input"),
      file: $("image-file"), attach: $("attach"), send: $("send"), count: $("online-count"),
      dot: $("status-dot"), toasts: $("toasts"), replyPreview: $("reply-preview"),
      replyText: $("reply-text"), cancelReply: $("cancel-reply"), imageWrap: $("image-preview-wrap"),
      imagePreview: $("image-preview"), imageName: $("image-name"), removeImage: $("remove-image"),
      onlineToggle: $("online-toggle"), statusDock: $("status-dock"),
      dockOnlineCount: $("dock-online-count"), statMsgs: $("stat-msgs"), statSize: $("stat-size"),
      statOffset: $("stat-offset"), statUid: $("stat-uid")
    };

    let db, uid = "", sessionId = createSessionId(), serverOffset = 0;
    let replyTarget = null, selectedImage = null, previewUrl = null, lastSentAt = 0;
    let firstLoad = true, messagesById = new Map();
    let presenceData = {}, heartbeatTimer = 0, relativeTimer = 0;
    let currentTheme = "og";
    const messageNodes = new Map();

    const THEMES = {
      og: "Original Crimson",
      lime: "Lime Green",
      cobalt: "Cobalt Blue",
      amber: "Amber Gold"
    };

    // Fast synchronous window-name fallback for immediate reload restoration
    function readCachedTheme() {
      try {
        const match = (window.name || "").match(/yappify_theme:([a-z]+)/);
        return match && THEMES[match[1]] ? match[1] : null;
      } catch {
        return null;
      }
    }

    function writeCachedTheme(theme) {
      try {
        const cleaned = (window.name || "").replace(/\s*yappify_theme:[a-z]+/g, "").trim();
        window.name = `${cleaned} yappify_theme:${theme}`.trim();
      } catch {}
    }

    // Theme switching logic with cloud & session persistence
    function applyTheme(theme, persist = false) {
      currentTheme = THEMES[theme] ? theme : "og";
      if (currentTheme === "og") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", currentTheme);
      }
      document.querySelectorAll(".theme-swatch").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.themeId === currentTheme);
      });
      writeCachedTheme(currentTheme);

      if (persist && db && uid) {
        set(ref(db, `users/${uid}/prefs/theme`), currentTheme).catch(err => {
          console.warn("Could not save theme preference to database", err);
        });
      }
    }

    const initialCachedTheme = readCachedTheme();
    if (initialCachedTheme) applyTheme(initialCachedTheme, false);

    document.querySelectorAll(".theme-swatch").forEach(btn => {
      btn.addEventListener("click", event => {
        event.stopPropagation();
        const nextTheme = btn.dataset.themeId;
        if (nextTheme === currentTheme) return;
        applyTheme(nextTheme, true);
        toast(`Theme: ${THEMES[nextTheme]}`);
      });
    });

    // Expandable Dock Toggle & Outside-Click Dismiss
    ui.onlineToggle.addEventListener("click", event => {
      event.stopPropagation();
      const isOpen = ui.statusDock.classList.toggle("open");
      ui.onlineToggle.setAttribute("aria-expanded", String(isOpen));
      if (isOpen) updateDbStats();
    });

    document.addEventListener("click", event => {
      if (!ui.statusDock.contains(event.target) && !ui.onlineToggle.contains(event.target)) {
        ui.statusDock.classList.remove("open");
        ui.onlineToggle.setAttribute("aria-expanded", "false");
      }
    });

    function updateDbStats() {
      const count = messagesById.size;
      ui.statMsgs.textContent = `${count} / ${MAX_MESSAGES}`;

      let totalBytes = 0;
      for (const msg of messagesById.values()) {
        totalBytes += JSON.stringify(msg).length;
      }
      ui.statSize.textContent = totalBytes > 1024
        ? `${(totalBytes / 1024).toFixed(1)} KB`
        : `${totalBytes} B`;

      ui.statOffset.textContent = `${serverOffset >= 0 ? "+" : ""}${Math.round(serverOffset)} ms`;
      ui.statUid.textContent = uid ? `${uid.slice(0, 6)}…${uid.slice(-4)}` : "connecting...";
      ui.statUid.title = uid || "Connecting";
    }

    function createSessionId() {
      try {
        let id = sessionStorage.getItem("yappify_session");
        if (!id) {
          id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
          sessionStorage.setItem("yappify_session", id);
        }
        return id;
      } catch {
        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      }
    }

    function serverNow() { return Date.now() + serverOffset; }

    function setStatus(status) {
      ui.dot.style.background = status === "online" ? "#86efac" : status === "error" ? "#fb7185" : "#fcd34d";
      ui.dot.title = status === "online" ? "Connected" : status === "error" ? "Connection error" : "Connecting";
    }

    function toast(message, error = false) {
      const node = document.createElement("div");
      node.className = `toast${error ? " error" : ""}`;
      node.textContent = message;
      ui.toasts.append(node);
      requestAnimationFrame(() => node.classList.add("show"));
      setTimeout(() => {
        node.classList.remove("show");
        setTimeout(() => node.remove(), 180);
      }, 2800);
    }

    function relativeTime(timestamp) {
      const ts = Number(timestamp);
      if (!Number.isFinite(ts) || ts <= 0) return "";
      const seconds = Math.max(0, Math.floor((serverNow() - ts) / 1000));
      if (seconds < 5) return "just now";
      if (seconds < 60) return `${seconds}sec ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}min ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}hr${hours === 1 ? "" : "s"} ago`;
      const days = Math.floor(hours / 24);
      return `${days}day${days === 1 ? "" : "s"} ago`;
    }

    function isNearBottom() {
      return ui.messages.scrollHeight - ui.messages.scrollTop - ui.messages.clientHeight < 100;
    }

    function scrollBottom(smooth = false) {
      ui.messages.scrollTo({ top: ui.messages.scrollHeight, behavior: smooth ? "smooth" : "auto" });
      ui.latest.hidden = true;
    }

    function safeTextWithLinks(parent, value, mine) {
      const text = String(value || "");
      const urlPattern = /(https?:\/\/[^\s<]+)/g;
      let cursor = 0;
      for (const match of text.matchAll(urlPattern)) {
        const start = match.index ?? 0;
        if (start > cursor) parent.append(document.createTextNode(text.slice(cursor, start)));
        const link = document.createElement("a");
        link.href = match[0];
        link.target = "_blank";
        link.rel = "noopener noreferrer nofollow";
        link.textContent = match[0];
        link.style.cssText = mine
          ? "color:inherit;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere"
          : "color:var(--soft);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere";
        link.addEventListener("click", event => event.stopPropagation());
        parent.append(link);
        cursor = start + match[0].length;
      }
      if (cursor < text.length) parent.append(document.createTextNode(text.slice(cursor)));
    }

    function copyText(value) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(value).then(() => toast("Message copied")).catch(() => fallbackCopy(value));
      } else fallbackCopy(value);
    }

    function fallbackCopy(value) {
      const field = document.createElement("textarea");
      field.value = value;
      field.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.append(field);
      field.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      field.remove();
      toast(ok ? "Message copied" : "Could not copy message", !ok);
    }

    function metaLine(parent, label, value) {
      const line = document.createElement("div");
      line.className = "meta-line";
      const key = document.createElement("span");
      key.className = "meta-key";
      key.textContent = label;
      const val = document.createElement("span");
      val.className = "meta-value";
      val.textContent = value || "—";
      line.append(key, val);
      parent.append(line);
    }

    function jumpToMessage(id) {
      const row = messageNodes.get(String(id));
      if (!row) return toast("Original message is no longer loaded", true);
      document.querySelectorAll(".message-jump-highlight").forEach(node => node.classList.remove("message-jump-highlight"));
      void row.offsetWidth;
      row.classList.add("message-jump-highlight");
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      clearTimeout(row.jumpTimer);
      row.jumpTimer = setTimeout(() => row.classList.remove("message-jump-highlight"), 2900);
    }

    function setReply(message) {
      replyTarget = {
        id: String(message.id),
        sender: String(message.sender || ""),
        text: String(message.text || "").slice(0, 180),
        imageUrl: message.imageUrl || null
      };
      ui.replyText.textContent = replyTarget.text || (replyTarget.imageUrl ? "Image" : "Message");
      ui.replyPreview.hidden = false;
      ui.input.focus();
    }

    function clearReply() {
      replyTarget = null;
      ui.replyPreview.hidden = true;
      ui.replyText.textContent = "";
    }

    function clearImage() {
      selectedImage = null;
      ui.file.value = "";
      ui.imageWrap.hidden = true;
      ui.imagePreview.removeAttribute("src");
      ui.imageName.textContent = "";
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    function attachSwipe(row, bubble, message) {
      let startX = 0, startY = 0, tracking = false, crossed = false;
      bubble.addEventListener("pointerdown", event => {
        if ((event.pointerType === "mouse" && event.button !== 0) || event.target.closest("button,a,img")) return;
        tracking = true;
        crossed = false;
        startX = event.clientX;
        startY = event.clientY;
      });
      bubble.addEventListener("pointermove", event => {
        if (!tracking) return;
        const dx = event.clientX - startX, dy = event.clientY - startY;
        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12) {
          tracking = false;
          bubble.style.transform = "";
          row.classList.remove("swiping");
          return;
        }
        if (dx > 0) {
          const distance = Math.min(dx, 92);
          if (distance > 8) {
            row.classList.add("swiping");
            bubble.style.transform = `translateX(${distance}px)`;
          }
          if (distance >= 64) crossed = true;
        }
      });
      const finish = () => {
        if (!tracking) return;
        tracking = false;
        bubble.style.transform = "";
        row.classList.remove("swiping");
        if (crossed) {
          setReply(message);
          row.dataset.skipClick = "1";
          setTimeout(() => delete row.dataset.skipClick, 250);
        }
      };
      bubble.addEventListener("pointerup", finish);
      bubble.addEventListener("pointercancel", finish);
      bubble.addEventListener("lostpointercapture", finish);
    }

    function renderMessage(message, previous) {
      const mine = message.sender === uid;
      const sameDayAsPrevious = previous && Number(message.ts) && Number(previous.ts) &&
        getDateKey(message.ts) === getDateKey(previous.ts);
      const grouped = sameDayAsPrevious && previous.sender === message.sender &&
        Number(message.ts) - Number(previous.ts) < 90000;

      const row = document.createElement("article");
      row.className = `message-row ${mine ? "mine" : "other"}${grouped ? " grouped" : ""}`;
      row.id = `message-${message.id}`;
      const hint = document.createElement("span");
      hint.className = "swipe-hint";
      hint.textContent = "↪";
      row.append(hint);

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.title = "Tap for technical details · Swipe right to reply";

      if (message.replyTo && typeof message.replyTo === "object") {
        const quote = document.createElement("button");
        quote.type = "button";
        quote.className = "reply-quote";
        quote.title = "Jump to original message";
        if (message.replyTo.sender === uid) {
          const author = document.createElement("span");
          author.className = "quote-author";
          author.textContent = "You";
          quote.append(author);
        }
        const quotedText = document.createElement("span");
        quotedText.className = "quote-text";
        quotedText.textContent = message.replyTo.text || (message.replyTo.imageUrl ? "Image" : "Message");
        quote.append(quotedText);
        quote.addEventListener("click", event => {
          event.stopPropagation();
          jumpToMessage(message.replyTo.id);
        });
        bubble.append(quote);
      }

      if (message.text) {
        const text = document.createElement("div");
        safeTextWithLinks(text, message.text, mine);
        bubble.append(text);
      }

      if (typeof message.imageUrl === "string" && /^https:\/\//i.test(message.imageUrl)) {
        const image = document.createElement("img");
        image.className = "message-image";
        image.src = message.imageUrl;
        image.alt = "Shared image";
        image.loading = "lazy";
        image.referrerPolicy = "no-referrer";
        image.addEventListener("click", event => {
          event.stopPropagation();
          window.open(message.imageUrl, "_blank", "noopener,noreferrer");
        });
        bubble.append(image);
      }

      const basic = document.createElement("div");
      basic.className = "basic-meta";
      if (mine) {
        const you = document.createElement("span");
        you.textContent = "You";
        basic.append(you);
      }
      const time = document.createElement("span");
      time.dataset.timestamp = message.ts || "";
      time.textContent = message.ts ? relativeTime(message.ts) : "";
      basic.append(time);
      bubble.append(basic);

      const details = document.createElement("div");
      details.className = "message-details";
      metaLine(details, "Message ID", message.id);
      metaLine(details, "Sender ID", message.sender);
      metaLine(details, "Local time", message.ts ? new Date(message.ts).toLocaleString() : "Unavailable");
      metaLine(details, "UTC time", message.ts ? new Date(message.ts).toISOString() : "Unavailable");
      metaLine(details, "Unix time", message.ts ? String(message.ts) : "Unavailable");
      metaLine(details, "Payload", `${(message.text || "").length} text chars${message.imageUrl ? " · image attached" : ""}${message.replyTo ? " · reply" : ""}`);

      const actions = document.createElement("div");
      actions.className = "actions";
      if (message.text) {
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copy";
        copy.addEventListener("click", event => {
          event.stopPropagation();
          copyText(message.text);
        });
        actions.append(copy);
      }
      const reply = document.createElement("button");
      reply.type = "button";
      reply.textContent = "↩ Reply";
      reply.addEventListener("click", event => {
        event.stopPropagation();
        setReply(message);
      });
      actions.append(reply);
      details.append(actions);
      bubble.append(details);

      bubble.addEventListener("click", event => {
        if (row.dataset.skipClick === "1") {
          delete row.dataset.skipClick;
          return;
        }
        if (event.target.closest("a,button,img")) return;
        row.classList.toggle("expanded");
      });
      attachSwipe(row, bubble, message);
      row.append(bubble);
      messageNodes.set(String(message.id), row);
      return row;
    }

    function getDateKey(timestamp) {
      const d = new Date(Number(timestamp));
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function formatDateBadge(timestamp) {
      const d = new Date(Number(timestamp));
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const yyyy = d.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function createDateDivider(timestamp) {
      const divider = document.createElement("div");
      divider.className = "date-divider";
      const label = document.createElement("span");
      label.textContent = formatDateBadge(timestamp);
      divider.append(label);
      return divider;
    }

    function drawMessages() {
      const wasAtBottom = firstLoad || isNearBottom();
      const ordered = [...messagesById.values()].sort((a,b) => (Number(a.ts)||0) - (Number(b.ts)||0));
      const fragment = document.createDocumentFragment();
      messageNodes.clear();
      if (!ordered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No messages yet.";
        fragment.append(empty);
      } else {
        let lastDateKey = "";
        ordered.forEach((message, index) => {
          const ts = Number(message.ts);
          if (Number.isFinite(ts) && ts > 0) {
            const dateKey = getDateKey(ts);
            if (dateKey !== lastDateKey) {
              fragment.append(createDateDivider(ts));
              lastDateKey = dateKey;
            }
          }
          fragment.append(renderMessage(message, ordered[index - 1]));
        });
      }
      ui.messages.replaceChildren(fragment);
      if (wasAtBottom) scrollBottom();
      else ui.latest.hidden = false;
      firstLoad = false;
      updateDbStats();
    }

    function updateRelativeTimes() {
      document.querySelectorAll("[data-timestamp]").forEach(node => {
        const ts = Number(node.dataset.timestamp);
        if (ts) node.textContent = relativeTime(ts);
      });
    }

    function setOnlineCount() {
      const now = serverNow();
      let count = 0;
      for (const userSessions of Object.values(presenceData)) {
        if (!userSessions || typeof userSessions !== "object") continue;
        for (const record of Object.values(userSessions)) {
          const ts = Number(record?.ts);
          if (Number.isFinite(ts) && now - ts >= -5000 && now - ts <= STALE_MS) count++;
        }
      }
      const strCount = String(count);
      ui.count.textContent = strCount;
      ui.dockOnlineCount.textContent = strCount;
    }

    let presenceRef, ownPresenceRef;
    async function startPresence() {
      presenceRef = ref(db, `presence/${ROOM}`);
      ownPresenceRef = ref(db, `presence/${ROOM}/${uid}/${sessionId}`);
      const connectedRef = ref(db, ".info/connected");
      const offsetRef = ref(db, ".info/serverTimeOffset");

      onValue(offsetRef, snap => {
        const value = snap.val();
        if (Number.isFinite(value)) {
          serverOffset = value;
          setOnlineCount();
          updateRelativeTimes();
          updateDbStats();
        }
      });

      onValue(presenceRef, snap => {
        presenceData = snap.val() || {};
        setOnlineCount();
      }, error => {
        console.error("Presence read failed", error);
        toast(`Presence error: ${error.code || error.message}`, true);
      });

      const heartbeat = async () => {
        if (document.visibilityState !== "visible") return;
        try {
          await set(ownPresenceRef, { uid, session: sessionId, ts: serverTimestamp() });
        } catch (error) {
          console.warn("Presence heartbeat failed", error);
        }
      };

      onValue(connectedRef, async snap => {
        if (snap.val() !== true) {
          setStatus("connecting");
          return;
        }
        setStatus("online");
        try {
          await onDisconnect(ownPresenceRef).remove();
          await heartbeat();
        } catch (error) {
          console.error("Presence setup failed", error);
          toast(`Presence setup failed: ${error.code || error.message}`, true);
        }
      });

      heartbeatTimer = setInterval(heartbeat, HEARTBEAT_MS);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") heartbeat();
        else remove(ownPresenceRef).catch(() => {});
      });
      window.addEventListener("pagehide", () => {
        clearInterval(heartbeatTimer);
        remove(ownPresenceRef).catch(() => {});
      }, { once: true });
    }

    function subscribeMessages() {
      const roomQuery = query(ref(db, `rooms/${ROOM}`), limitToLast(MAX_MESSAGES));
      onValue(roomQuery, snapshot => {
        const next = new Map();
        snapshot.forEach(child => {
          const data = child.val();
          if (!data || typeof data !== "object") return;
          if (data.ghost === true || (typeof data.id === "string" && data.id.startsWith("ghost_"))) return;
          const text = typeof data.text === "string" ? data.text.replace(/\u200b/g, "").trim() : "";
          const imageUrl = typeof data.imageUrl === "string" ? data.imageUrl : "";
          if (!text && !imageUrl) return;
          next.set(child.key, { ...data, id: child.key, text });
        });
        messagesById = next;
        drawMessages();
        setStatus("online");
      }, error => {
        console.error("Message listener failed", error);
        setStatus("error");
        toast(`Firebase read error: ${error.code || error.message}`, true);
      });
    }

    async function uploadImage(file) {
      if (!allowedImages.has(file.type) || file.size > MAX_IMAGE_BYTES) {
        throw new Error("Use JPG, PNG, WEBP, or GIF up to 5 MB.");
      }
      const body = new FormData();
      body.append("image", file);
      body.append("name", file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-80));
      toast("Uploading image...");
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${encodeURIComponent(IMAGE_HOST_KEY)}`, {
        method: "POST", body
      });
      const result = await response.json().catch(() => null);
      if (!response.ok || !result?.success || !result?.data?.url) {
        throw new Error(result?.error?.message || `Image upload failed (${response.status})`);
      }
      return result.data.url;
    }

    let profanity = null;
    async function loadProfanityFilter() {
      try {
        const module = await import("https://esm.sh/leo-profanity@1.9.0");
        profanity = module.default || module;
      } catch (error) {
        console.warn("Filter module could not load", error);
        toast("Word filter unavailable. Text sending is paused.", true);
      }
    }

    ui.attach.addEventListener("click", () => ui.file.click());
    ui.cancelReply.addEventListener("click", clearReply);
    ui.removeImage.addEventListener("click", clearImage);
    ui.latest.addEventListener("click", () => scrollBottom(true));
    ui.messages.addEventListener("scroll", () => {
      if (isNearBottom()) ui.latest.hidden = true;
    });

    ui.file.addEventListener("change", () => {
      const file = ui.file.files?.[0];
      if (!file) return;
      if (!allowedImages.has(file.type)) {
        toast("Choose a JPG, PNG, WEBP, or GIF image.", true);
        return clearImage();
      }
      if (file.size > MAX_IMAGE_BYTES) {
        toast("Image must be 5 MB or smaller.", true);
        return clearImage();
      }
      selectedImage = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      ui.imagePreview.src = previewUrl;
      ui.imageName.textContent = file.name;
      ui.imageWrap.hidden = false;
    });

    ui.input.addEventListener("input", () => {
      ui.input.style.height = "auto";
      ui.input.style.height = `${Math.min(ui.input.scrollHeight,128)}px`;
    });
    ui.input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        ui.form.requestSubmit();
      }
    });

    ui.form.addEventListener("submit", async event => {
      event.preventDefault();
      const raw = ui.input.value.trim();
      const file = selectedImage;
      if (!raw && !file) return;
      if (!db || !uid) return toast("Connecting to database. Try again shortly.", true);
      if (raw && !profanity) return toast("Word filter is still loading. Try again shortly.", true);
      const now = Date.now();
      if (now - lastSentAt < SEND_COOLDOWN_MS) {
        return toast(`Wait ${((SEND_COOLDOWN_MS - (now-lastSentAt))/1000).toFixed(1)}s`, true);
      }

      ui.send.disabled = true;
      ui.attach.disabled = true;
      try {
        const cleaned = raw && profanity ? profanity.clean(raw, "*") : "";
        const imageUrl = file ? await uploadImage(file) : null;
        const payload = {
          sender: uid,
          text: cleaned.slice(0,500),
          ts: serverTimestamp()
        };
        if (imageUrl) payload.imageUrl = imageUrl;
        if (replyTarget) payload.replyTo = { ...replyTarget };
        await push(ref(db, `rooms/${ROOM}`), payload);
        if (cleaned !== raw) toast("Some words were replaced with *.");
        lastSentAt = Date.now();
        ui.input.value = "";
        ui.input.style.height = "auto";
        clearImage();
        clearReply();
      } catch (error) {
        console.error("Send failed", error);
        toast(`${error.code ? error.code + ": " : ""}${error.message || "Message failed to send."}`, true);
      } finally {
        ui.send.disabled = false;
        ui.attach.disabled = false;
        ui.input.focus();
      }
    });

    async function boot() {
      setStatus("connecting");
      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        db = getDatabase(app, firebaseConfig.databaseURL);

        const authTimeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Anonymous sign-in timed out. Check Firebase Authentication and network access.")), 15000)
        );
        const credential = await Promise.race([signInAnonymously(auth), authTimeout]);
        uid = credential.user.uid;
        updateDbStats();

        // Sync saved theme preference from Firebase RTDB for this user
        onValue(ref(db, `users/${uid}/prefs/theme`), snap => {
          const saved = snap.val();
          if (typeof saved === "string" && THEMES[saved] && saved !== currentTheme) {
            applyTheme(saved, false);
          } else if (!saved && currentTheme !== "og") {
            set(ref(db, `users/${uid}/prefs/theme`), currentTheme).catch(() => {});
          }
        }, () => {});

        subscribeMessages();
        await startPresence();
        setStatus("online");
      } catch (error) {
        console.error("App startup failed", error);
        setStatus("error");
        toast(`Firebase error: ${error.code || error.message || "Could not connect"}`, true);
      }
    }

    window.addEventListener("error", event => {
      console.error("Yappify runtime error:", event.error || event.message);
      setStatus("error");
      toast(`App error: ${event.message || "Unknown script error"}`, true);
    });
    window.addEventListener("unhandledrejection", event => {
      const reason = event.reason;
      console.error("Yappify unhandled rejection:", reason);
      setStatus("error");
      toast(`App error: ${reason?.code || reason?.message || "Unexpected async error"}`, true);
    });

    ui.messages.innerHTML = '<div class="loading"><span class="loader"><span>.</span><span>.</span><span>.</span></span></div>';
    relativeTimer = setInterval(updateRelativeTimes, 1000);
    loadProfanityFilter();
    boot();
    setInterval(setOnlineCount, 5000);
  </script>
</body>
</html>
